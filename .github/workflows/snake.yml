name: Generate Snake

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nbsheep
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306b6d4&color_dots=%23ebedf0,%23a5f3fc,%2322d3ee,%230ea5e9,%2310b981
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2306b6d4&color_dots=%230d1117,%23a5f3fc,%2322d3ee,%230ea5e9,%2310b981

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
