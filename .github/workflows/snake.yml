name: Generate Snake

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nbsheep
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23fe428e&color_dots=%23ebedf0,%23a855f7,%236366f1,%230ea5e9,%23fe428e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23fe428e&color_dots=%23161321,%23a855f7,%236366f1,%230ea5e9,%23fe428e

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
